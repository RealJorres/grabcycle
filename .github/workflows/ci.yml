name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, unit, emulator integration & rules tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:emulator

  admin:
    name: Admin dashboard (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Builds without Firebase config; the bundle shows a "not configured"
      # screen until real VITE_* values are supplied at deploy time.
      - run: npx vite build

  android:
    name: Android (core unit tests, app unit tests, lint, debug build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Print lint findings
        if: always()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || echo "No lint text report"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
          if-no-files-found: ignore

  android-device:
    name: Android instrumented smoke tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The CI build has no google-services.json, so these tests cover layout
      # inflation on a real runtime and the screens that must work without Firebase.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest
      # Gradle does not list instrumented results in the log; print them and
      # fail if the run silently executed no tests.
      - name: Instrumented test summary
        if: always()
        working-directory: android
        run: |
          files=$(find app/build/outputs/androidTest-results -name 'TEST-*.xml' 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No instrumented test results found"; exit 1; fi
          python3 - $files <<'EOF'
          import sys, xml.etree.ElementTree as ET
          total = bad = 0
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              for suite in ([root] if root.tag == 'testsuite' else root.iter('testsuite')):
                  for case in suite.iter('testcase'):
                      total += 1
                      failed = case.find('failure') is not None or case.find('error') is not None
                      skipped = case.find('skipped') is not None
                      bad += failed
                      print(f"{'FAILED ' if failed else 'SKIPPED' if skipped else 'passed '} {case.get('classname')}.{case.get('name')}")
          print(f"{total} tests, {bad} failed")
          sys.exit(1 if total == 0 or bad else 0)
          EOF
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
